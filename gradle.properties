# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false
android.bundle.enable16kAlignment=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Both flags below are deprecated in AGP 9 and slated for removal in AGP 10, and both are still
# load-bearing with Kotlin 2.1.21 — verified by removing them and building:
#
#   android.builtInKotlin=true -> AGP registers its own `kotlin` extension, and applying
#     org.jetbrains.kotlin.android fails with "Cannot add extension with name 'kotlin'".
#   android.newDsl=true        -> ApplicationExtensionImpl is no longer a BaseExtension, and
#     org.jetbrains.kotlin.android still casts to it: ClassCastException at plugin apply.
#
# Clearing these means reworking the KMP/Android plugin setup (or a KGP that supports the new
# DSL), not just flipping the flags. Must happen before AGP 10.
android.builtInKotlin=false
android.newDsl=false

ksp.allow.common.main=true

# Single source of truth for the app version. Read by androidApp's `versionName` and by
# composeApp's `generateAppVersion` task, which compiles it into commonMain for AppConfig.
# It used to be typed out separately in the build script and in both AppConfig actuals, which
# is three places to remember on a release and three chances to ship a version that lies.
notelikeus.versionName=1.0.1
