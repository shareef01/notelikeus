[package]
name = "nlk-tauri"
description = "Experimental Tauri 2 shell for the Rust Notelikeus core: guest-mode notes in the encrypted store."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "notelikeus-rust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notelikeus-core = { path = "../notelikeus-core", features = ["http"] }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
