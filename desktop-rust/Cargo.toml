[workspace]
resolver = "3"
members = ["crates/notelikeus-core", "crates/notelikeus-app", "crates/nlk-cli", "crates/nlk-tauri", "crates/nlk-native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-AllRightsReserved"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes-gcm = "0.10"
getrandom = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[profile.release]
lto = true
codegen-units = 1

# Keep application code line-debuggable while avoiding full dependency symbols in dev/test builds.
# Cargo's test profile inherits dev; debug assertions and overflow checks remain enabled.
[profile.dev]
debug = 1
incremental = true
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
debug = 0
