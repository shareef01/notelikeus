[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
junit = "4.13.2"
# Instrumented tests only (composeApp androidInstrumentedTest). The quarantine path in
# PlaintextDatabaseMigrator runs real SQLCipher, whose native libraries do not exist off-device,
# so it cannot be covered by Robolectric.
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.3.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.1.21"
serialization = "1.11.0"
room = "2.8.4"
ksp = "2.3.11"
turbine = "1.2.1"
mockk = "1.14.11"
coroutines = "1.11.0"
# kotlinx-coroutines-test ships on the same version train as core; bump it together with
# `coroutines`. Kept as a separate ref so production code never resolves to a test variable.
coroutinesTest = "1.11.0"
robolectric = "4.16.1"
datastore = "1.2.1"
biometric = "1.1.0"
glance = "1.1.1"
appfunctions = "1.0.0-alpha09"
sqlcipher = "4.18.0"
securityCrypto = "1.1.0"
# Covers androidx.sqlite:sqlite and the desktop's sqlite-bundled driver, which ship together on
# one version train. The bundled driver used to sit on 2.5.0-alpha13 while this said 2.5.0, so
# conflict resolution quietly dragged the whole group onto the alpha.
#
# Ahead of Room on purpose: room 2.8.4 declares sqlite 2.6.2, so this resolves it upward
# (`sqlite:2.6.2 -> 2.7.0`). Re-verified on the 2.7.0 -> 2.8.4 bump — the desktop suite, including
# the real-database transaction test, is green, and the pin still resolves upward rather than
# downgrading. It does still mean Room runs against a sqlite it was not built with, so keep pairing
# the next Room bump with a check of this line.
sqlite = "2.7.0"
okio = "3.9.1"
jna = "5.19.1"
appcompat = "1.7.0"
fragment = "1.8.2"
googleServices = "4.5.0"
firebaseBom = "34.17.0"
credentials = "1.5.0"
googleid = "1.2.0"
windowSize = "1.3.1"
compose-multiplatform = "1.8.2"
# The four versions below must stay on the same Compose Multiplatform line (currently 1.8.x).
# Anything that resolves org.jetbrains.compose.* ABOVE compose-multiplatform wins conflict
# resolution and upgrades every Compose library, while compose.desktop.currentOs stays pinned to
# the CMP plugin's version — the mismatched skiko native binary then kills the desktop app at
# startup with UnsatisfiedLinkError(RenderNodeContext_nMake). koin-compose 4.2.x pulls Compose
# 1.10 and does exactly that, so bump these together or not at all.
# JetBrains adaptive tracks androidx-adaptive versions separately; 1.1.x is the CMP 1.8 line.
composeAdaptive = "1.1.2"
composeNavigation = "2.9.0-beta03"
koin = "4.1.1"
# Koin requests 2.9.1 and this upgrades it; it is not a pin, and it is not what holds the version
# down. 2.11.0 is what breaks: it depends on compose-runtime 1.11 directly, which wins conflict
# resolution and leaves runtime at 1.11 while compose-ui and skiko stay on the CMP plugin's 1.8.2.
# The packaged app then dies composing App() with "CompositionLocal LocalHostDefaultProvider not
# present". Measured in D18; #70 is blocked on this, not on Koin.
composeLifecycle = "2.9.3"
work = "2.11.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-datastore-preferences-android = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-windowSizeClass = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "windowSize" }

# Compose Multiplatform (JetBrains) variants — these are the ones commonMain must use.
# The androidx equivalents above are Android-first and drag androidx.compose.ui:ui-text-jvmstubs
# onto the desktop classpath, where it shadows org.jetbrains.compose.ui:ui-text and makes the app
# die at startup with NotImplementedError("Implemented only in JetBrains fork").
compose-navigation = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "composeNavigation" }
# Provides collectAsStateWithLifecycle in commonMain. It used to arrive transitively, which meant a
# dependency bump elsewhere could silently remove it.
compose-lifecycle-runtime = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "composeLifecycle" }
compose-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "composeLifecycle" }
compose-material3-windowSizeClass = { group = "org.jetbrains.compose.material3", name = "material3-window-size-class", version.ref = "compose-multiplatform" }
compose-adaptive = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive", version.ref = "composeAdaptive" }
compose-adaptive-layout = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-layout", version.ref = "composeAdaptive" }
compose-adaptive-navigation = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "composeAdaptive" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
androidx-appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-service = { group = "androidx.appfunctions", name = "appfunctions-service", version.ref = "appfunctions" }
androidx-appfunctions-compiler = { group = "androidx.appfunctions", name = "appfunctions-compiler", version.ref = "appfunctions" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
# Credential Manager — the supported replacement for the deprecated GoogleSignIn API.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
google-identity-googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }

