name: Supabase CI

on:
  push:
    branches: [main, master, migration/supabase-r2]
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Proves migrations rebuild a fresh database from committed files alone.
      - name: Start local Supabase stack
        run: npm run supabase:start

      - name: Reset database from migrations
        run: npm run supabase:reset

      - name: Run pgTAP database tests
        run: npm run supabase:test

      - name: Stop local Supabase stack
        if: always()
        run: npm run supabase:stop
