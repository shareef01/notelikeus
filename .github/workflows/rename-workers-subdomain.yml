name: Rename workers.dev subdomain

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: New account workers.dev subdomain label
        required: true
        default: notelikeus

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set account workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBDOMAIN: ${{ inputs.subdomain }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/sub.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"${SUBDOMAIN}\"}")"
          echo "HTTP ${code}"
          jq '{success, errors, result}' /tmp/sub.json
          test "$code" = "200"
          echo "workers.dev subdomain -> ${SUBDOMAIN}"