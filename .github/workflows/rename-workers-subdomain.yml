name: Rename workers.dev subdomain

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: New account workers.dev subdomain label
        required: true
        default: notelikeus

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Replace account workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBDOMAIN: ${{ inputs.subdomain }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          echo "Current subdomain:"
          curl -sS "$base" "${auth[@]}" | jq '{success, errors, result}'

          echo "Deleting existing subdomain (required before rename)…"
          del_code="$(curl -sS -o /tmp/del.json -w "%{http_code}" -X DELETE "$base" "${auth[@]}")"
          echo "DELETE HTTP ${del_code}"
          if [ -s /tmp/del.json ]; then jq '{success, errors, result}' /tmp/del.json || true; fi
          # Cloudflare returns 200 or 204 on success; 404 if already gone
          test "$del_code" = "200" -o "$del_code" = "204" -o "$del_code" = "404"

          echo "Creating subdomain ${SUBDOMAIN}…"
          put_code="$(curl -sS -o /tmp/put.json -w "%{http_code}" -X PUT "$base" "${auth[@]}" \
            --data "{\"subdomain\":\"${SUBDOMAIN}\"}")"
          echo "PUT HTTP ${put_code}"
          jq '{success, errors, result}' /tmp/put.json
          test "$put_code" = "200"
          echo "workers.dev subdomain -> ${SUBDOMAIN}"
