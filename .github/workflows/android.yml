name: Android CI

on:
  push:
    branches: [main, master]
    # Without this the v* tag conditions below are dead code: a `branches` filter
    # alone excludes tag pushes, so "tag a release" never actually built anything.
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# One pipeline per ref: a newer push supersedes an older run, so a burst of commits
# to main does not burn a full emulator boot per commit.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# gradle.properties asks for a 2 GB daemon heap, which is fine on a warm local daemon but marginal
# on a runner: PackageAndroidArtifact died with OutOfMemoryError while packaging the debug APK on
# PR #47, on a commit that packages cleanly on a developer machine. Overriding here rather than in
# gradle.properties keeps local builds on the smaller heap that already suits them. The failure was
# nondeterministic, which is what made it worth fixing — it attaches to whichever PR happens to be
# running and reads as that PR's fault.
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      # :androidApp has its own unit tests. Leaving them out of CI let them drift until they
      # stopped compiling entirely — the same failure mode as the instrumented suite below.
      - name: Run androidApp unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      # No task below compiles androidTest, so the instrumented suite silently
      # drifted out of sync with the composables it tests and stopped compiling.
      # Compiling it here catches that without needing an emulator.
      - name: Compile instrumented tests
        run: >
          ./gradlew :composeApp:compileDebugAndroidTestSources
          :androidApp:compileDebugAndroidTestSources --stacktrace

      - name: Run Android lint
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # Release artifacts are unsigned in CI (no signing.properties) and are only
      # consumed at release time, so building both on every push roughly doubles the
      # build job's cost for nothing. Tag a release (v*) to run them.
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Build release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :androidApp:bundleRelease --stacktrace

      # Consumed by the `release` job below — same run, so it downloads by run id
      # rather than needing another third-party action.
      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-aab
          path: androidApp/build/outputs/bundle/release/*.aab

  # The instrumented suite needs a real Android runtime: PlaintextDatabaseMigrator opens SQLCipher
  # databases, whose native libraries are packaged per-ABI and have no JVM build, so Robolectric
  # cannot reach that code at all. Without this job those tests only ever ran on demand — and a
  # test nothing guarantees to run is indistinguishable from one that was deleted.
  #
  # Split from `build` rather than appended to it: booting an emulator is slow and flakier than
  # the rest of CI, and keeping it separate means a boot failure does not mask a compile failure.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Two API levels, because the suite's whole subject is version-sensitive. The one test here,
    # PlaintextDatabaseMigratorTest, drives SQLCipher and Room against a real filesystem -- and
    # SQLite ships *with the platform*, so which Android version it runs on changes the thing
    # under test. API 30 alone was testing one point of a range that starts at minSdk 26 and now
    # targets 37.
    #
    # Not about predictive back. `enableOnBackInvokedCallback` is API 33+, but no instrumented
    # test exercises back navigation, so raising the API level would not have covered it -- that
    # gap needs a test, not a newer emulator.
    #
    # fail-fast off: when one level breaks, the other's result is the most useful thing for
    # telling an API-specific failure from a real regression.
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # KVM is what makes the x86_64 emulator usable on a CI runner; without it the boot times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          disable-animations: true
          # :androidApp's suite is the predictive-back check, which has to live beside the
          # manifest that declares the opt-in. It self-skips below API 33, so the api-30 leg
          # reports it as skipped rather than as a pass it did not earn.
          script: >
            ./gradlew :composeApp:connectedDebugAndroidTest
            :androidApp:connectedDebugAndroidTest --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-report-api${{ matrix.api-level }}
          path: |
            composeApp/build/reports/androidTests/
            androidApp/build/reports/androidTests/

  # Publishes the tag's artifacts as a GitHub Release. Runs only after every gate has
  # passed — a release tag on a red build must not ship. CI has no signing config
  # (see signing.properties.example), so the attached APK/AAB are unsigned; this repo's
  # distribution model is build-from-source plus the Firebase-hosted web app.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n release-apk -D dist
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n release-aab -D dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            -R "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
