name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      # :androidApp has its own unit tests. Leaving them out of CI let them drift until they
      # stopped compiling entirely — the same failure mode as the instrumented suite below.
      - name: Run androidApp unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      # No task below compiles androidTest, so the instrumented suite silently
      # drifted out of sync with the composables it tests and stopped compiling.
      # Compiling it here catches that without needing an emulator.
      - name: Compile instrumented tests
        run: ./gradlew :composeApp:compileDebugAndroidTestSources --stacktrace

      - name: Run Android lint
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Build release AAB
        run: ./gradlew :androidApp:bundleRelease --stacktrace
