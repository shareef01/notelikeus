name: Desktop CI

on:
  push:
    branches: [main, master]
    # Tag pushes keep the app-image checks honest on the released source. Packaging the installer
    # is manual by design - dispatch this workflow from main with the release tag as input.
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build the MSI from and attach it to (e.g. v2.0.0)'
        required: true
        type: string
      replace_existing_asset:
        description: 'Replace an MSI asset that already exists on that release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One pipeline per ref: a newer push supersedes an older run, so a burst of commits
# to main does not burn a full emulator boot per commit.
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The daemon JVM is pinned to 21 by gradle/gradle-daemon-jvm.properties. With no local 21,
      # Gradle downloads one from Foojay, and an outage there (HTTP 400 on the pinned URL) fails
      # every Gradle invocation in the job before a single task runs. Provisioning it here removes
      # that dependency; the build itself still runs on 17.
      - name: Set up JDK 21 for the Gradle daemon
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 17 for the build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Point Gradle at the provisioned JDK 21
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile desktop
        run: ./gradlew :composeApp:compileKotlinDesktop --stacktrace

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --stacktrace

  # Linux CI uses IdentitySecureBlobStore stand-ins and keeps BundledSQLiteDriver by default.
  # Windows is where Crypt32 DPAPI and the JDBC SQLCipher default actually ship — exercise them.
  windows-crypto:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # See the `build` job: provision the daemon JVM instead of relying on Foojay being up.
      - name: Set up JDK 21 for the Gradle daemon
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 17 for the build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Point Gradle at the provisioned JDK 21
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run desktop tests (real DPAPI + Windows SQLCipher default)
        run: ./gradlew.bat :composeApp:desktopTest --stacktrace

  # The jobs above run against the full JDK, where every module is on hand. The MSI does not:
  # jlink builds its runtime from the `modules` list in composeApp/build.gradle.kts, and anything
  # missing there fails only once the app is installed. That is how the packaged build lost
  # java.net.http — no HttpClient, so sign-in and every Supabase RPC died — while CI stayed
  # green. Windows because the MSI is the only desktop format shipped.
  package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # See the `build` job: provision the daemon JVM instead of relying on Foojay being up.
      - name: Set up JDK 21 for the Gradle daemon
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 17 for the build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Point Gradle at the provisioned JDK 21
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build the packaged app image
        run: ./gradlew.bat :composeApp:createDistributable --stacktrace

      # Building is not the check: jlink succeeds either way and just emits a smaller runtime.
      # Assert the modules are actually in the image.
      - name: Verify the jlink runtime carries the modules cloud sync needs
        shell: pwsh
        run: |
          $release = "composeApp/build/compose/binaries/main/app/Notelikeus/runtime/release"
          if (-not (Test-Path $release)) { throw "No runtime image at $release" }
          $modules = (Get-Content $release | Select-String '^MODULES=').ToString()
          $missing = @('java.net.http', 'jdk.unsupported', 'java.naming', 'jdk.crypto.ec', 'java.management', 'jdk.httpserver') |
            Where-Object { $modules -notmatch [regex]::Escape($_) }
          if ($missing) { throw "jlink runtime is missing: $($missing -join ', ')" }
          Write-Host "All required modules present."

      # The list above only checks what someone remembered to add to it, which is how
      # java.management went missing: AppConfig.isDebug started asking the RuntimeMXBean whether a
      # JDWP agent is attached, and the packaged app died on its first Koin resolution -- before a
      # window was ever shown -- while this job stayed green. Launching it checks every module at
      # once, including the ones nobody has thought of yet.
      - name: Launch the packaged app and confirm it survives startup
        shell: pwsh
        run: |
          $exe = "composeApp/build/compose/binaries/main/app/Notelikeus/Notelikeus.exe"
          if (-not (Test-Path $exe)) { throw "No packaged executable at $exe" }
          $out = Join-Path $env:RUNNER_TEMP "desktop-stdout.log"
          $err = Join-Path $env:RUNNER_TEMP "desktop-stderr.log"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          # Long enough for Koin, Room and the first frame; the failure it guards is immediate.
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Host "--- stdout ---"; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content $err -ErrorAction SilentlyContinue
            throw "The packaged app exited with code $($p.ExitCode) instead of staying up."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Packaged app started and stayed up."

  # Packages the Windows installer for an EXISTING release and attaches it to that release.
  #
  # Manual runs from main only. A release tag points at a commit cut before this workflow existed,
  # so nothing can be dispatched on that tag - the run has to come from main (this file) with the
  # tag named as an input, and that tag is then checked out so the installer is built from the
  # released source rather than from main's tip. The tag is only ever read: `gh release upload`
  # adds an asset to a release and cannot move or recreate a ref.
  msi-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    # The only job in this workflow with write access, and the only one that publishes anything.
    permissions:
      contents: write

    steps:
      - name: Validate the requested release tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "release_tag is required" }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') { throw "release_tag '$tag' does not look like a release tag" }

      # The released source, not main's tip: the installer must correspond to the release commit.
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - name: Prove the checkout is the tag's commit
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          $head = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-parse "$tag^{commit}").Trim()
          Write-Host "release $tag = $tagSha · building from $head"
          if ($head -ne $tagSha) { throw "checked out $head but $tag points at $tagSha" }
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_SHA=$head"

      # See the `build` job: provision the daemon JVM instead of relying on Foojay being up.
      - name: Set up JDK 21 for the Gradle daemon
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK 17 for the build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Point Gradle at the provisioned JDK 21
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"

      - name: Install WiX (jpackage needs it to build an MSI)
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Build the app image and the MSI
        run: |
          ./gradlew.bat :composeApp:createDistributable --stacktrace
          ./gradlew.bat :composeApp:packageMsi --stacktrace

      - name: Verify the jlink runtime carries the modules cloud sync needs
        shell: pwsh
        run: |
          $release = "composeApp/build/compose/binaries/main/app/Notelikeus/runtime/release"
          if (-not (Test-Path $release)) { throw "No runtime image at $release" }
          $modules = (Get-Content $release | Select-String '^MODULES=').ToString()
          $missing = @('java.net.http', 'jdk.unsupported', 'java.naming', 'jdk.crypto.ec', 'java.management', 'jdk.httpserver') |
            Where-Object { $modules -notmatch [regex]::Escape($_) }
          if ($missing) { throw "jlink runtime is missing: $($missing -join ', ')" }
          Write-Host "All required modules present."

      # Before anything is published: install the MSI and confirm the installed copy stays up.
      - name: Install the MSI and confirm the installed app launches
        shell: pwsh
        run: |
          $msi = Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw "jpackage produced no MSI" }
          Write-Host "Installing $($msi.Name)"
          $log = Join-Path $env:RUNNER_TEMP "msi-install.log"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @("/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$log`"")
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
            throw "msiexec failed with exit code $($p.ExitCode)"
          }
          $dir = Get-ChildItem "C:\Program Files" -Directory -Filter "Notelikeus*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dir) { throw "No install directory under C:\Program Files" }
          $exe = Get-ChildItem $dir.FullName -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "No executable under $($dir.FullName)" }
          $out = Join-Path $env:RUNNER_TEMP "installed-stdout.log"
          $err = Join-Path $env:RUNNER_TEMP "installed-stderr.log"
          $q = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 30
          if ($q.HasExited) {
            Write-Host "--- stdout ---"; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content $err -ErrorAction SilentlyContinue
            throw "The installed app exited with code $($q.ExitCode) instead of staying up."
          }
          Stop-Process -Id $q.Id -Force
          Write-Host "Installed app at $($exe.FullName) started and stayed up."

      - name: Upload the MSI as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-${{ env.RELEASE_TAG }}
          path: composeApp/build/compose/binaries/main/msi/*.msi

      # Only after the installer has been built AND smoke-tested. The release must already exist;
      # an asset of the same name is a hard stop unless replace_existing_asset was set explicitly.
      - name: Attach the MSI to the named release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { throw "Release $tag does not exist; nothing was attached." }
          $msi = (Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName
          $name = [System.IO.Path]::GetFileName($msi)
          $existing = gh release view $tag --json assets --jq '.assets[].name'
          if ($existing -contains $name) {
            if ("${{ inputs.replace_existing_asset }}" -ne "true") {
              throw "Asset $name already exists on $tag. Re-run with replace_existing_asset=true if replacing it is intended."
            }
            Write-Host "Replacing $name on $tag (replace_existing_asset=true)"
            gh release upload $tag $msi --clobber
          } else {
            gh release upload $tag $msi
          }
          if ($LASTEXITCODE -ne 0) { throw "Uploading $name to $tag failed" }
          Write-Host "Attached $name to $tag (release $env:RELEASE_SHA) - the tag itself was not touched."
