name: Desktop CI

on:
  push:
    branches: [main, master, weiter]
  pull_request:
    branches: [main, master, weiter]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile desktop
        run: ./gradlew :composeApp:compileKotlinDesktop --stacktrace

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --stacktrace
