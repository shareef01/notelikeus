name: Firebase CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Firestore security rules
        run: npm run test:rules

      # The web sync layer is exercised against the same emulator, with the production rules
      # enforced. It lives in web/ rather than here because it imports the app's own modules
      # through their `@/` alias. Without this step it would only ever run locally.
      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Test the web sync layer against the emulator
        run: npm run test:sync
        working-directory: web
