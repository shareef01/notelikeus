name: Sync Worker Supabase secrets

# Pulls the active project's service_role key via Management API and uploads it
# to the attachments Worker. Optional: delete a paused/abandoned staging project.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref (API host subdomain)'
        required: true
        default: 'ddxmubeaeeomureolvbu'
      worker_name:
        description: 'Cloudflare Worker name'
        required: true
        default: 'notelikeus-attachments'
      delete_inactive_ref:
        description: 'Optional inactive project ref to delete (empty = skip)'
        required: false
        default: 'cqydlidescvmpfviwncf'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (wrangler.toml scaffold only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve service_role and update Worker secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_REF: ${{ inputs.project_ref }}
          WORKER_NAME: ${{ inputs.worker_name }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          keys="$(curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys")"
          service_role="$(printf '%s' "$keys" | jq -r '
            (.[] | select(.name == "service_role") | .api_key // .key // empty)
            // empty
          ')"
          if [ -z "$service_role" ] || [ "$service_role" = "null" ]; then
            echo "Management API did not return a service_role key"
            exit 1
          fi
          echo "::add-mask::$service_role"
          mkdir -p workers/attachments
          cat > workers/attachments/wrangler.toml <<EOF
name = "${WORKER_NAME}"
main = "src/index.ts"
compatibility_date = "2025-09-02"
account_id = "${CLOUDFLARE_ACCOUNT_ID}"
EOF
          printf '%s' "$service_role" | npx --yes wrangler@4 secret put SUPABASE_SERVICE_ROLE_KEY \
            --config workers/attachments/wrangler.toml
          echo "Uploaded SUPABASE_SERVICE_ROLE_KEY to Worker ${WORKER_NAME}"

      - name: Delete inactive staging project (optional)
        if: ${{ inputs.delete_inactive_ref != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DELETE_REF: ${{ inputs.delete_inactive_ref }}
        run: |
          set -euo pipefail
          status="$(curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${DELETE_REF}" | jq -r .status)"
          echo "Target ${DELETE_REF} status=${status}"
          if [ "$status" != "INACTIVE" ] && [ "$status" != "INACTIVE_FAILED" ]; then
            echo "Refusing to delete project that is not INACTIVE (got ${status})"
            exit 1
          fi
          code="$(curl -sS -o /tmp/del.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${DELETE_REF}")"
          echo "DELETE HTTP ${code}"
          # 200/204 success; some accounts return 200 with body
          test "$code" = "200" -o "$code" = "204"
          echo "Deleted inactive project ${DELETE_REF}"
