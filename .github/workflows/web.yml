name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One pipeline per ref: a newer push supersedes an older run, so a burst of commits
# to main does not burn a full emulator boot per commit.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Named apart from Android and Desktop CI's `build` jobs: branch protection on main requires
    # these checks by name, and a shared name would let another workflow's job satisfy it.
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Coverage gates for security-critical modules
        run: npm run test:coverage

      - name: Typecheck and build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.payload.signature

      - name: Verify Pages artifacts
        working-directory: .
        run: node web/scripts/verifyPagesArtifacts.mjs

      - name: Test the bundle secret scan
        working-directory: .
        run: node --test web/scripts/bundleSecrets.test.mjs

      - name: Verify security headers
        working-directory: .
        run: node cloudflare/scripts/verify-headers-parity.mjs

  # Each browser project gets its own local Supabase and still runs one worker.
  e2e_projects:
    name: Web e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repo dependencies
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: bash scripts/ops/retry-supabase-start.sh npx supabase start

      - name: Reset database from migrations
        run: npm run supabase:reset
        # `supabase:reset` passes `--yes` so this step cannot hang on a TTY confirm.

      # The database suite is shared by both browsers and runs once on a fresh database.
      - name: Run pgTAP database tests
        if: matrix.project == 'chromium'
        run: npm run supabase:test

      - name: Run Playwright E2E
        working-directory: web
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Check isolated UI recovery surfaces
        working-directory: web
        run: npx playwright test --config playwright.surfaces.config.ts --project=${{ matrix.project }}

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e-traces-${{ matrix.project }}
          path: web/test-results/

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop

  # Preserve the required check name in branch protection. Run even on failure
  # so a failed, skipped, or cancelled matrix cannot pass the gate.
  e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: e2e_projects
    if: always()
    steps:
      - name: Require both browser projects to pass
        env:
          E2E_RESULT: ${{ needs.e2e_projects.result }}
        run: |
          echo "Browser matrix result: $E2E_RESULT"
          test "$E2E_RESULT" = success
