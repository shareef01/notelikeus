name: Deploy

# Test-gated deploy for Firebase Hosting + Firestore rules. Nothing else gates a deploy: the
# manual path (`npm run deploy` in web/) can ship an untested tree, so this workflow is the
# one that cannot — the same rules and web suites that run on every PR must pass first.
#
# Requires repository configuration before first use:
#   - Secret  FIREBASE_TOKEN  — token from `firebase login:ci` for the notelikeus project
#   - Vars    VITE_FIREBASE_* — the real web/.env values (public app identifiers, not secrets;
#     see scripts/setup-web-env.ps1 for where each one comes from)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a deploy mid-flight; a superseded run should queue behind, not kill it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (root)
        run: npm ci

      - name: Test Firestore security rules
        run: npm run test:rules

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Run web unit tests
        run: npm test
        working-directory: web

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (root, for firebase-tools)
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # Real values, unlike the placeholder build in web.yml: this bundle ships.
      - name: Build web app
        run: npm run build
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_GOOGLE_CLIENT_ID: ${{ vars.VITE_FIREBASE_GOOGLE_CLIENT_ID }}

      - name: Deploy Hosting and Firestore rules
        run: npx firebase deploy --only hosting,firestore:rules --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
