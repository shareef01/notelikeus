name: Attachments Worker CI

# The R2 attachments Worker is the authorization boundary for attachment bytes: it derives the R2
# object key from the bearer token's user id, and it is the only place upload size and content-type
# limits are enforced (the editors' 10 MB cap is a UX affordance — the Worker is reachable directly
# with any Supabase access token).

on:
  # Owner-operated Worker deploy. Deploy this only after the Supabase migrations it
  # depends on have been applied: a Worker calling an RPC its database does not have
  # yet answers 503, while the older Worker's RPCs all still exist, so schema-first is
  # safe in both directions and Worker-first is not.
  workflow_dispatch:
    inputs:
      confirm_worker_name:
        description: 'Type the Worker name to confirm (notelikeus-attachments)'
        required: true
        type: string
      r2_bucket:
        description: 'R2 bucket holding attachment objects'
        required: true
        default: notelikeus-attachments-dev
        type: string
      allowed_origins:
        description: 'Extra CORS origins, comma-separated. localhost and notelikeus-dev.pages.dev are always allowed; a custom domain must be listed here.'
        required: false
        default: ''
        type: string
      rate_limit_requests:
        description: 'Requests allowed per key per period, counted at the edge. 0 disables Worker-level throttling (auth is unaffected either way).'
        required: false
        default: '120'
        type: string
      rate_limit_period:
        description: 'Rate-limit window in seconds. Cloudflare accepts only 10 or 60.'
        required: false
        default: '60'
        type: string
  push:
    branches: [main, master]
    paths:
      - 'workers/**'
      - '.github/workflows/attachments-worker.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'workers/**'
      - '.github/workflows/attachments-worker.yml'

permissions:
  contents: read

# A burst of pushes should supersede itself; a deploy must not be cancelled part-way
# through `wrangler deploy`, nor superseded by an unrelated push to the same ref.
concurrency:
  group: attachments-worker-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/attachments/package-lock.json

      - name: Install worker dependencies
        working-directory: workers/attachments
        run: npm ci

      - name: Lint worker
        working-directory: workers/attachments
        run: npm run lint

      - name: Typecheck worker
        working-directory: workers/attachments
        run: npm run typecheck

      - name: Test worker (auth, owner isolation, upload limits)
        working-directory: workers/attachments
        run: npm test

  # wrangler.toml is gitignored -- it carries an account id and the environment's bucket
  # name -- so the deploy writes one from the same shape scripts/ops/setup-staging.sh
  # uses, rather than expecting a file the repository does not have.
  #
  # `environment: production` is where to attach required reviewers if this should ever
  # need a second pair of eyes; it works unconfigured today.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The same project URL and public anon JWT the Pages build uses, read from those
      # secrets rather than duplicated under a second name that could drift out of step.
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Cloudflare secrets and a matching confirmation
        env:
          # Through env, never interpolated into the script: these are operator input.
          CONFIRM_WORKER_NAME: ${{ inputs.confirm_worker_name }}
          R2_BUCKET: ${{ inputs.r2_bucket }}
          RATE_LIMIT_REQUESTS: ${{ inputs.rate_limit_requests }}
          RATE_LIMIT_PERIOD: ${{ inputs.rate_limit_period }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret for: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Needed: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          # Typing the name is what makes this a decision rather than a misclick.
          if [ "$CONFIRM_WORKER_NAME" != "notelikeus-attachments" ]; then
            echo "confirm_worker_name must be notelikeus-attachments. Nothing was deployed."
            exit 1
          fi
          if [ -z "$R2_BUCKET" ]; then
            echo "r2_bucket must not be empty. Nothing was deployed."
            exit 1
          fi
          # The browser anon JWT begins eyJ. A secret API key here would hand a live
          # privileged credential to the Worker's callers.
          case "$SUPABASE_ANON_KEY" in
            eyJ*) ;;
            sb_*) echo "VITE_SUPABASE_ANON_KEY looks like a secret API key. Use the public anon JWT."; exit 1 ;;
            *) echo "VITE_SUPABASE_ANON_KEY does not look like a JWT."; exit 1 ;;
          esac
          # Rejected here rather than at deploy time: a malformed rate-limit binding is a
          # `wrangler deploy` failure on a Worker that may already be live.
          case "$RATE_LIMIT_REQUESTS" in
            ''|*[!0-9]*) echo "rate_limit_requests must be a whole number (0 disables throttling)."; exit 1 ;;
          esac
          if [ "$RATE_LIMIT_REQUESTS" != "0" ] && [ "$RATE_LIMIT_PERIOD" != "10" ] && [ "$RATE_LIMIT_PERIOD" != "60" ]; then
            echo "rate_limit_period must be 10 or 60 — the only windows Cloudflare's rate limiter accepts."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/attachments/package-lock.json

      - name: Write wrangler.toml
        env:
          R2_BUCKET: ${{ inputs.r2_bucket }}
          ALLOWED_ORIGINS: ${{ inputs.allowed_origins }}
          RATE_LIMIT_REQUESTS: ${{ inputs.rate_limit_requests }}
          RATE_LIMIT_PERIOD: ${{ inputs.rate_limit_period }}
        run: |
          # Values are written through the environment by a script, never pasted into
          # the YAML, so nothing here can be broken by a quote inside an input.
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const q = (v) => JSON.stringify(String(v));
            const lines = [
              `name = "notelikeus-attachments"`,
              `main = "src/index.ts"`,
              `compatibility_date = "2025-09-02"`,
              `account_id = ${q(process.env.CLOUDFLARE_ACCOUNT_ID)}`,
              ``,
              `[[r2_buckets]]`,
              `binding = "ATTACHMENTS_BUCKET"`,
              `bucket_name = ${q(process.env.R2_BUCKET)}`,
              ``,
              `[vars]`,
              `SUPABASE_URL = ${q(process.env.SUPABASE_URL)}`,
            ];
            if (process.env.ALLOWED_ORIGINS) {
              lines.push(`ALLOWED_ORIGINS = ${q(process.env.ALLOWED_ORIGINS)}`);
            }
            // Without this binding the Worker has no throttling at all: rateLimit.ts is a no-op
            // when the binding is absent, so the code shipped but the deployment never turned it
            // on. Counted by Cloudflare at the edge, which is the only place a limit survives the
            // request landing on a different isolate.
            //
            // Deliberately independent of authorization: the limiter only ever returns 429, and
            // it fails open, so a limiter outage cannot hand out access or take the API down.
            const limit = Number(process.env.RATE_LIMIT_REQUESTS ?? 0);
            const period = Number(process.env.RATE_LIMIT_PERIOD ?? 60);
            if (limit > 0) {
              lines.push(
                ``,
                `[[unsafe.bindings]]`,
                `name = "ATTACHMENT_RATE_LIMITER"`,
                `type = "ratelimit"`,
                `namespace_id = "1001"`,
                `simple = { limit = ${limit}, period = ${period} }`,
              );
            }
            lines.push(``, `[triggers]`, `crons = ["15 */6 * * *"]`, ``);
            writeFileSync("workers/attachments/wrangler.toml", lines.join("\n"));
          '
          # Printed without the account id, so the binding and cron stay reviewable.
          grep -v '^account_id' workers/attachments/wrangler.toml

      - name: Install worker dependencies
        working-directory: workers/attachments
        run: npm ci

      # Deploy before secrets, and in two steps, because wrangler-action uploads any
      # `secrets:` it is given *before* running its command. On a Worker that does not
      # exist yet there is nothing to attach a secret to, and the API answers
      # "Could not route to /accounts/.../workers/scripts/<name>/settings [code: 7003]".
      # The script has to exist first. Once it does, the order stops mattering -- secrets
      # outlive a deploy -- so this shape is correct on both the first run and every
      # later one.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/attachments
          command: deploy

      # SUPABASE_ANON_KEY is a Worker secret rather than a wrangler.toml var, which would
      # place it in the deploy log. The second deploy costs a few seconds and leaves the
      # live Worker running with the secret in place; without it the freshly created
      # Worker would answer every request 500 until the next dispatch.
      - name: Upload Worker secret and redeploy with it
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/attachments
          command: deploy
          secrets: |
            SUPABASE_ANON_KEY
        env:
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # The cron orphan sweep (src/sweep.ts) needs a service-role key to call the cleanup RPCs,
      # and does nothing at all without one -- `serviceRoleHeaders` returns null and every RPC
      # short-circuits. That no-op is the correct default: a service-role key bypasses row-level
      # security entirely, so it is opt-in per deployment rather than something a dispatch
      # silently requires.
      #
      # Whether the secret exists is decided in its own step because the `secrets:` list is
      # uploaded unconditionally -- naming SUPABASE_SERVICE_ROLE_KEY there when it is unset would
      # store an empty secret, and an empty key is not the same as no key to a reader of the
      # Worker's settings. Only the presence flag is echoed; the value never leaves the env.
      - name: Check whether the orphan sweep is configured
        id: sweep
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Orphan sweep: service-role key present, the cron will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Orphan sweep: no SUPABASE_SERVICE_ROLE_KEY secret, the cron stays a deliberate no-op."
          fi

      - name: Enable the orphan sweep
        if: steps.sweep.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/attachments
          command: deploy
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
