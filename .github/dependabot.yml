version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/workers/attachments"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # See docs/DECISIONS.md, D18. lifecycle 2.10+ depends on compose-runtime 1.11 directly, and a
      # direct dependency wins conflict resolution -- so the runtime jumps while compose-ui and
      # skiko stay on the CMP plugin's 1.8.2. The packaged desktop app then dies composing App()
      # with "CompositionLocal LocalHostDefaultProvider not present". Re-checked on 2026-08-27:
      # it now also drags androidx.compose.runtime onto the desktop classpath, which is the
      # separate hazard libs.versions.toml warns about.
      #
      # This is NOT "the bump is unwanted" -- it is that it cannot land alone. Nothing in CI can
      # catch the failure: it compiles, lints, unit-tests and packages green, and dies only when
      # the packaged app composes its first frame. Dependabot re-proposing it weekly means
      # re-deciding it weekly from a green checkmark, which is how it eventually gets merged.
      #
      # REMOVE THIS ENTRY when Compose Multiplatform moves off 1.8.x -- the two have to move
      # together. The check is: resolve desktopRuntimeClasspath and confirm compose runtime, ui
      # and skiko all agree before packaging.
      #
      # Patches on the 2.9.x line still come through; only 2.10+ is held.
      - dependency-name: "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose"
        versions: [">= 2.10"]
      - dependency-name: "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose"
        versions: [">= 2.10"]

      # Same hazard, different package. Koin 4.2.2 depends on Compose UI 1.10.2 directly, and a
      # direct dependency wins conflict resolution, so `org.jetbrains.compose.ui:ui` resolves
      # 1.8.2 -> 1.10.2 while the Compose compiler plugin stays on the CMP 1.8.x it targets. The
      # desktop UI tests then die with
      #   NoSuchFieldError: PlatformContext does not have member field 'Companion'
      # Verified on 2026-09-16 by bumping it and running :composeApp:desktopTest.
      #
      # Unlike the lifecycle entry above, this one IS caught by CI — NoteReorderSemanticsTest and
      # ReminderDialogTest fail — so it cannot land silently. Held anyway to stop it being
      # re-proposed and re-diagnosed every week.
      #
      # REMOVE THIS ENTRY with the lifecycle one, when Compose Multiplatform moves off 1.8.x.
      - dependency-name: "io.insert-koin:*"
        versions: [">= 4.2"]

      # See docs/DECISIONS.md, D27. googleid 1.2.1 is compiled with Kotlin 2.4 metadata and this
      # build's compiler (2.2.0, which reads up to 2.3) refuses it:
      #   GoogleSignInHelper.kt: Class 'GetGoogleIdOption' was compiled with an incompatible
      #   version of Kotlin. The actual metadata version is 2.4.0
      # Dependency verification is not the obstacle -- checksums for it were added and passed -- so
      # this fails at compile time, which is why it cannot land silently. The compiler's suggested
      # -Xskip-metadata-version-check is not an answer: it silences the check without making the
      # classes readable, and this is the Google sign-in path.
      #
      # REMOVE THIS ENTRY when Kotlin moves to 2.4 (it moves with Compose Multiplatform, as the
      # lifecycle and Koin entries above).
      - dependency-name: "com.google.android.libraries.identity.googleid:googleid"
        versions: [">= 1.2.1"]

      # See docs/DECISIONS.md, D27. composeAdaptive >= 1.2 raises Compose UI, foundation and animation
      # on the desktop classpath from 1.8.2 to 1.9.0 while material3, material and ripple stay on the
      # 1.8.2 the CMP plugin targets -- the mixed-stack hazard of D18, which compiles and unit-tests
      # green and dies only when the packaged app composes its first frame. Verified on 2026-10-10 by
      # resolving desktopRuntimeClasspath with adaptive 1.2.0 and with 1.1.2 side by side. 1.3.0 is
      # worse and is caught: 59 of 742 desktop tests die with
      #   NoSuchFieldError: PlatformContext does not have member field 'Companion'
      # -- the same signature as the Koin 4.2 entry above.
      #
      # REMOVE THIS ENTRY with the lifecycle and Koin ones, when Compose Multiplatform moves off 1.8.x.
      - dependency-name: "org.jetbrains.compose.material3.adaptive:*"
        versions: [">= 1.2"]
