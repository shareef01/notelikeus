version: 2
# Low-maintenance Dependabot configuration: monthly grouped routine version updates with a small PR limit.
# Security updates remain enabled separately via GitHub security settings.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/workers/attachments"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      # Android Gradle Plugin upgrades require manual regeneration of gradle/verification-metadata.xml
      # checksums. Automated bumps fail dependency verification by design.
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      - dependency-name: "com.android.kotlin.multiplatform.library"

      # No holds on Compose Multiplatform, lifecycle, navigation, adaptive or Koin any more. They
      # were here because a library asking for a newer Compose than the plugin ships splits the
      # desktop stack across versions, which nothing in CI caught (docs/DECISIONS.md D16, D18, D27,
      # D28). `:composeApp:verifyComposeLine` now fails the desktop test job when that happens, so
      # a bump that cannot land alone shows up red here and is not re-decided from a green check.

      # The one exception. JetBrains Material3 has its own version numbers, but each release is built
      # for one Compose Multiplatform release: 1.13.0-beta02 needs Compose 1.13. `composeMaterial3`
      # in libs.versions.toml is set by hand to the version the plugin's release notes pair with it,
      # so a bump proposed on its own is always wrong, and because Gradle updates are grouped it
      # turns the whole group red (#462). Move it together with `compose-multiplatform`.
      - dependency-name: "org.jetbrains.compose.material3:*"
